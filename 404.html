<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Page Not Found | Muhammad Fahad Javed</title>

    <meta
        name="description"
        content="The page you're looking for could not be found."
    >

    <meta name="robots" content="noindex, follow">

    <link rel="canonical" href="https://muhammadfahadjaved.vercel.app/">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #050505;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            width: min(900px, 90%);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .error-code {
            font-size: clamp(7rem, 22vw, 16rem);
            line-height: 0.8;
            font-weight: 900;
            letter-spacing: -0.08em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.25);
            position: relative;
            animation: float 5s ease-in-out infinite;
        }

        .error-code::after {
            content: "404";
            position: absolute;
            inset: 0;
            color: rgba(255, 255, 255, 0.04);
            filter: blur(18px);
            z-index: -1;
        }

        .eyebrow {
            margin-top: 45px;
            margin-bottom: 16px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #999999;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
            margin-bottom: 18px;
        }

        .description {
            max-width: 560px;
            margin: 0 auto 35px;
            color: #999999;
            font-size: 1rem;
            line-height: 1.7;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            padding: 14px 22px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition:
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease;
        }

        .button.primary {
            background: #ffffff;
            color: #050505;
            border-color: #ffffff;
        }

        .button:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .button.primary:hover {
            background: #e8e8e8;
        }

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.035);
            filter: blur(80px);
        }

        .orb.one {
            top: -180px;
            left: -100px;
        }

        .orb.two {
            right: -150px;
            bottom: -180px;
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.025) 1px,
                    transparent 1px
                );
            background-size: 60px 60px;
            mask-image: radial-gradient(
                circle at center,
                black,
                transparent 75%
            );
        }

        .footer {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #555555;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @media (max-width: 600px) {
            body {
                overflow: auto;
            }

            .container {
                padding: 60px 0 80px;
            }

            .error-code {
                font-size: 8rem;
            }

            .eyebrow {
                margin-top: 35px;
            }

            .description {
                font-size: 0.95rem;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 200px;
            }

            .footer {
                position: absolute;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="grid"></div>
        <div class="orb one"></div>
        <div class="orb two"></div>
    </div>

    <main class="container">

        <div class="error-code">404</div>

        <div class="eyebrow">
            Page Not Found
        </div>

        <h1>
            Lost in the code?
        </h1>

        <p class="description">
            The page you're looking for doesn't exist, may have been moved,
            or the URL might be incorrect. Let's get you back on track.
        </p>

        <div class="buttons">

            <a
                href="/"
                class="button primary"
            >
                ← Back Home
            </a>

            <a
                href="/#projects"
                class="button"
            >
                View Projects
            </a>

        </div>

    </main>

    <div class="footer">
        © 2026 Muhammad Fahad Javed
    </div>

</body>
</html>
