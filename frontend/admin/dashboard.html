<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin Dashboard — Portfolio CMS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><i class="fas fa-layer-group" aria-hidden="true"></i> Portfolio CMS</div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <button id="logoutBtn"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Log Out</button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="btn mobile-nav-toggle" id="mobileNavToggle"><i class="fas fa-bars"></i></button>
          <h1 id="topbarTitle">Dashboard</h1>
        </div>
        <div>
          <a href="../index.html" target="_blank" class="btn btn-sm" style="margin-right:8px;"><i class="fas fa-eye"></i> View Site</a>
          <span class="admin-email" id="adminEmail"></span>
        </div>
      </header>
      <main class="content" id="content">
        <div class="loading-row"><span class="spinner"></span></div>
      </main>
    </div>
  </div>

  <div id="toast-root"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/rte.js"></script>
  <script src="js/media.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
